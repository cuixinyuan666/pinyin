<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>奖励时间</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:linear-gradient(135deg,#FFE082,#FF8A65,#4FC3F7);font-family:"PingFang SC","Microsoft YaHei",sans-serif;}
  .wrap{position:relative;width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;}
  .big{font-size:14vw;font-weight:bold;color:#fff;text-shadow:0 4px 0 #EF6C00,0 8px 16px rgba(0,0,0,.25);animation:pop 1s ease-in-out infinite alternate;}
  .sub{margin-top:3vh;font-size:6vw;color:#fff;opacity:.95;}
  .stars{font-size:10vw;margin-top:2vh;animation:spin 3s linear infinite;}
  .confetti{position:absolute;top:-10%;width:14px;height:14px;border-radius:3px;opacity:.9;animation:fall linear infinite;}
  @keyframes pop{from{transform:scale(1)}to{transform:scale(1.12)}}
  @keyframes spin{from{transform:rotate(0)}to{transform:rotate(360deg)}}
  @keyframes fall{to{transform:translateY(120vh) rotate(720deg)}}
</style>
</head>
<body>
<div class="wrap" id="wrap">
  <div class="stars">⭐🌟✨</div>
  <div class="big">你真棒！</div>
  <div class="sub">休息一下，马上开始新的一轮～</div>
</div>
<script>
  var colors=['#FF5252','#FFD740','#69F0AE','#40C4FF','#E040FB','#FF6E40'];
  var wrap=document.getElementById('wrap');
  for(var i=0;i<40;i++){
    var c=document.createElement('div');
    c.className='confetti';
    c.style.left=Math.random()*100+'%';
    c.style.background=colors[i%colors.length];
    c.style.animationDuration=(2+Math.random()*3)+'s';
    c.style.animationDelay=(Math.random()*3)+'s';
    wrap.appendChild(c);
  }
</script>
</body>
</html>
